name: Release iOS SDK

# Tag this repo to publish. Other SDKs are not involved.
#   git tag 2.1.1 && git push origin 2.1.1
# SPM: https://github.com/Tareq-Ghassan/GazePointSDK-iOS

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate:
    name: Build Swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: |
          xcodebuild -scheme GazePointSDK \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
